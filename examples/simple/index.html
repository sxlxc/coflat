<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Coflat Editor Showcase</title>
  </head>
  <body class="cf-theme-scope">
    <div class="demo-shell">
      <aside class="demo-sidebar" aria-label="Demo documents">
        <div class="demo-brand">
          <div class="demo-brand-title">Coflat</div>
          <div class="demo-brand-subtitle">editor demo</div>
        </div>
        <nav class="demo-nav" aria-label="Documents">
          <a class="demo-doc-link" href="?doc=showcase" data-doc-id="showcase" aria-current="page">
            Showcase
          </a>
          <a class="demo-doc-link" href="?doc=format" data-doc-id="format">
            Format guide
          </a>
        </nav>
        <div class="demo-tools">
          <div class="demo-tools-label">Development</div>
          <button
            id="view-source"
            class="demo-source-button"
            type="button"
            aria-controls="source-dialog"
            aria-haspopup="dialog"
          >
            View source
          </button>
        </div>
        <nav class="demo-nav demo-nav-secondary" aria-label="Project links">
          <a href="https://github.com/chaoxu/coflat">GitHub</a>
          <a href="https://github.com/chaoxu/coflat/blob/main/FORMAT.md">FORMAT.md</a>
        </nav>
      </aside>
      <main class="demo-main">
        <div id="editor"></div>
      </main>
    </div>
    <dialog id="source-dialog" class="demo-source-dialog" aria-labelledby="source-dialog-title">
      <div class="demo-source-header">
        <h2 id="source-dialog-title">Document source</h2>
        <form method="dialog">
          <button class="demo-source-close" type="submit">Close</button>
        </form>
      </div>
      <pre class="demo-source-code"><code id="document-source"></code></pre>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
